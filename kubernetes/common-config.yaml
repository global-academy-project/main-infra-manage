apiVersion: v1
kind: ConfigMap
metadata:
  name: common-mysql-config

data:
  MYSQL_DATABASE: ocrdb
  MYSQL_PORT: "3306"
  MYSQL_USER: user
  MYSQL_ENCODING_TYPE: utf8mb4
  MYSQL_COLLATION: utf8mb4_unicode_ci
  TZ: Asia/Seoul

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: common-python-config

data:
  EMBEDDING_URL: http://embedding-service:60110/v1/embeddings
  EMBEDDING_MODEL: "BAAI/bge-m3"
  EMBEDDING_DIM: "1024"
  EMBEDDING_MAX_TOKENS: "8192"
  EMBEDDING_MAX_BATCH_SIZE: "8"
  EMBEDDING_LOCAL_FILES_ONLY: "false"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: common-model-config

data:
  VISION_MODEL_PATH: model/yolox/yolox_nano.onnx
  VISION_HELMET_MODEL_PATH: /models/yolox/helmet_nano.onnx

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: common-kb-config

data:
  KB_DATABASE: agent_kb
  # `KB_DB_PORT`와 `KB_DB_HOST`는 MySQL의 포트와 서비스의 주소를 동일하게 설정해야 하기 때문에
  # Job 등에서 `MYSQL_PORT`의 값을 참조하도록 설정 예정
  KB_DB_HOST: mysql-service
  KB_DB_PORT: "3306"