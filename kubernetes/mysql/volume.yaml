apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-data
spec:
  resources:
    requests:
      # Note: 본 프로젝트에서 대용량 파일들이 아닌 `kb` 단위 파일들이 주로 이루어지기 때문에 1Gi면 충분하다 판단한다.
      storage: 1Gi
  volumeMode: Filesystem
  # Feat: ReadWriteOnce는 하나의 노드에서만 볼륨을 읽고 쓸 수 있도록 하면서 여러 파드가 같은 노드에서 해당 볼륨을 공유하는 것은 허용한다.
  # Note: MySQL은 단일 StatefulSet 인스턴스로 운영한다. 하나의 노드에서만 볼륨을 마운트해도 요구사항을 충족하므로 ReadWriteOnce를 사용한다.
  accessModes:
    - ReadWriteOnce