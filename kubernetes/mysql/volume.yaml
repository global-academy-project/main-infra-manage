apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-data-pvc

spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # MySQL 데이터 저장용으로 충분한 용량(1Gi ~ 5Gi)을 할당한다.
      storage: 1Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-migration-pvc
spec:
  accessModes:
    - ReadOnlyMany
  resources:
    requests:
      # MySQL의 마이그레이션 스크립트용으로 사용되기 때문에 상대적으로 작은 용량으로 충분하다.
      storage: 300Mi