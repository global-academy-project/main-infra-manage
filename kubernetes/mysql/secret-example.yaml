#### WARNING: 절대 공개되어선 안되는 API 키나 비밀번호 혹은 토큰과 같은 민감한 정보는 Git에 추가하지 말것
#### Note
# 시크릿의 환경 변수 값들은 base64에서 디코딩되어 컨테이너내 주입되기 때문에,
# 실제 비밀번호와 API 키를 base64로 인코딩한 값으로 대체해야 한다.

apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  labels:
    app: mysql

type: Opaque

data:
  # MySQL Secret Configuration
  MYSQL_PASSWORD: YOUR_MYSQL_PASSWORD
  MYSQL_ROOT_PASSWORD: YOUR_MYSQL_ROOT_PASSWORD
  # KB Secret Configuration
  KB_OWNER_PASSWORD: YOUR_KB_OWNER_PASSWORD
  KB_INGEST_PASSWORD: YOUR_KB_INGEST_PASSWORD
  KB_READER_PASSWORD: YOUR_KB_READER_PASSWORD

---
apiVersion: v1
kind: Secret
metadata:
  name: mysql-init-secret

type: Opaque

data:
  # Migration Secret Configuration
  # `FLYWAY_PASSWORD`는 기존 `KB_OWNER_PASSWORD`와 동일한 값으로 설정하고 사용해도 무방하다.
  FLYWAY_PASSWORD: YOUR_FLYWAY_PASSWORD
  EMBEDDING_API_KEY: YOUR_EMBEDDING_API_KEY