apiVersion: batch/v1
kind: Job
metadata:
  name: mysql-migration

spec:
  template:
    spec:
      # restartPolicy: [Never, Always, OnFailure]
      restartPolicy: Never
      containers:
      - name: mysql-migration
        image: flyway/flyway:13.12-alpine
        env:
        - name: KB_OWNER_USER
          valueFrom:
            configMapKeyRef:
              name: common-kb-config
              key: KB_OWNER_USER
        - name: FLYWAY_PASSWORD
          # FLYWAY_PASSWORD는 common-kb-secret의 KB_OWNER_PASSWORD와 동일한 값이다.
          valueFrom:
            secretKeyRef:
              name: common-kb-secret
              key: KB_OWNER_PASSWORD
        envFrom:
        - configMapRef:
            name: common-embedding-config
        - secretRef:
            name: common-embedding-secret
        volumeMounts:
        - name: mysql-migration-pvc
          mountPath: /db/migration
      volumes:
      - name: mysql-migration-pvc
        persistentVolumeClaim:
          claimName: mysql-migration-pvc