#### WARNING: 절대 공개 가능한 정보만 추가하되 API 키나 비밀번호 혹은 토큰과 같은 민감한 정보는 포함하지 말것

apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-client-config
  labels: 
    app: mysql

data:
  # MySQL Client Configuration
  # MYSQL_HOST: mysql-service
  MYSQL_USER: user
  MYSQL_DATABASE: ocrdb
  TZ: Asia/Seoul

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-init-config

data:
  # MySQL Initialization Configuration
  KB_OWNER_USER: kb_owner
  EMBEDDING_URL: http://python-embedding-model:60110/v1/embeddings
  EMBEDDING_MODEL: BAAI/bge-m3
  EMBEDDING_DIM: "1024"
  EMBEDDING_MAX_TOKENS: "8192"
  EMBEDDING_MAX_BATCH_SIZE: "8"