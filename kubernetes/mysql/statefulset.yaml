apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql-client
spec:
  selector:
    matchLabels:
      app: mysql
  serviceName: mysql-service
  replicas: 1
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
      - name: mysql-client-container
        image: mysql:8.4.13-oraclelinux9
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        envFrom:
        - configMapRef:
            name: mysql-init-scripts
        - configMapRef:
            name: common-mysql-config
        - secretRef:
            name: common-mysql-secret
        - secretRef:
            name: common-kb-secret
        volumeMounts:
        - name: mysql-data-pvc
          mountPath: /var/lib/mysql
        - name: mysql-init-scripts
          mountPath: /docker-entrypoint-initdb.d
        args:
        - mysqld
        - --character-set-server=utf8mb4
        - --collation-server=utf8mb4_unicode_ci
        - --default-time-zone=+09:00
      volumes:
        - name: mysql-init-scripts
          configMap:
            name: mysql-init-scripts
    volumeClaimTemplates:
    - metadata:
        name: mysql-data-pvc