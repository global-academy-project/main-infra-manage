apiVersion: v1
kind: Secret
metadata:
  name: common-spring-secret
type: Opaque

data:
  # Spring Secret Configuration
  JWT_SECRET: YOUR_BASE64_ENCODED_JWT_SECRET
  INTERNAL_API_TOKEN: YOUR_BASE64_ENCODED_INTERNAL_API_TOKEN
  # Admin Secret Configuration [사용자가 직접 임의로 설정 가능]
  ADMIN_EMAIL: YOUR_BASE64_ENCODED_ADMIN_EMAIL
  ADMIN_PASSWORD: YOUR_BASE64_ENCODED_ADMIN_PASSWORD

---
apiVersion: v1
kind: Secret
metadata:
  name: common-embedding-secret
type: Opaque

data:
  # Embedding Secret Configuration
  EMBEDDING_API_KEY: YOUR_BASE64_ENCODED_EMBEDDING_API_KEY

---
apiVersion: v1
kind: Secret
metadata:
  name: common-kb-secret
type: Opaque

data:
  # KB Secret Configuration
  KB_OWNER_PASSWORD: YOUR_BASE64_ENCODED_KB_OWNER_PASSWORD
  KB_INGEST_PASSWORD: YOUR_BASE64_ENCODED_KB_INGEST_PASSWORD
  KB_READER_PASSWORD: YOUR_BASE64_ENCODED_KB_READER_PASSWORD
  KB_INGEST_API_TOKEN: YOUR_BASE64_ENCODED_KB_INGEST_API_TOKEN

---
apiVersion: v1
kind: Secret
metadata:
  name: common-mysql-secret
type: Opaque

annotations:
  description: |
    MYSQL_PASSWORD = MYSQL_ROOT_PASSWORD

    MYSQL_PASSWORD와 MYSQL_ROOT_PASSWORD는 현재 프로젝트의 개발 편의성을 고려하여 동일한 패스워드를 적용

data:
  # MySQL Secret Configuration
  MYSQL_PASSWORD: YOUR_BASE64_ENCODED_MYSQL_PASSWORD
  MYSQL_ROOT_PASSWORD: YOUR_BASE64_ENCODED_MYSQL_ROOT_PASSWORD

---
#### Flyway => MySQL Client Migration Secret
apiVersion: v1
kind: Secret
metadata:
  name: common-flyway-secret
type: Opaque

annotations:
  description: |
    FLYWAY_PASSWORD = KB_OWNER_PASSWORD

    Flyway 마이그레이션 시 사용되는 비밀번호는 KB_OWNER_PASSWORD와 동일

data:
  # Flyway Secret Configuration
  FLYWAY_PASSWORD: YOUR_BASE64_ENCODED_KB_OWNER_PASSWORD

---
apiVersion: v1
kind: Secret
metadata:
  name: common-qdrant-secret
type: Opaque

data:
  # Python Secret Configuration
  QDRANT_API_KEY: YOUR_BASE64_ENCODED_QDRANT_API_KEY
  QDRANT_READ_ONLY_API_KEY: YOUR_BASE64_ENCODED_QDRANT_READ_ONLY_API_KEY

---
apiVersion: v1
kind: Secret
metadata:
  name: common-kosha-secret
type: Opaque

data:
  # ETC Secret Configuration
  KOSHA_MSDS_SERVICE_KEY: YOUR_BASE64_ENCODED_KOSHA_MSDS_SERVICE_KEY