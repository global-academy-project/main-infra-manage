apiVersion: v1
kind: ConfigMap
metadata:
  name: config-public
data:
  key: .env.public

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mypvc
spec:
  resources:
    requests:
      storage: 30Gi
  # Volume mode for the persistent volume claim [Filesystem, Block]
  # Currently set to Filesystem
  volumeMode: Filesystem
  # Volume access mode for the persistent volume claim [ReadWriteOnce, ReadOnlyMany, ReadWriteMany, ReadWriteOncePod]
  # Currently set to ReadWriteOnce
  accessModes:
    - ReadWriteOnce

---
apiVersion: v1
kind: Service
metadata:
  name: mysql-service
  labels:
    app: mysql
spec:
  selector:
    app: mysql-server

  ports:
    - protocol: TCP
      port: 3306
      targetPort: 3306

---
apiVersion: v1
kind: Service
metadata:
  name: qdrant-service
  labels:
    app: qdrant

spec:
  selector:
    app: qdrant-server

  ports:
    - protocol: TCP
      port: 6333
      targetPort: 6333

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql-server
  labels:
    app: mysql

---
apiVersion: batch/v1
kind: Job
metadata:
  name: mysql-migrate
  labels:
    app: mysql-migrate

spec:
  template:
    spec:
      containers:
        - name: mysql-migrate
          image: flyway/flyway:13.12-alpine

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qdrant-server
  labels:
    app: qdrant-server

spec:
  selector:
    matchLabels:
      app: qdrant-server
  serviceName: "qdrant-service"
  replicas: 1
  template:
    metadata:
      labels:
        app: qdrant-server
    spec:
      containers:
        - name: qdrant-client-container
          image: qdrant/qdrant:v1.2.0
          ports:
            - containerPort: 6333
          volumeMounts:
            - name: qdrant-data
              mountPath: /qdrant/storage
      volumes:
        - name: qdrant-data
          persistentVolumeClaim:
            claimName: mypvc

---
apiVersion: batch/v1
kind: Job
metadata:
  name: qdrant-init
  labels:
    app: qdrant-init