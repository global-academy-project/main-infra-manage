#### WARNING: 절대 공개되어선 안되는 API 키나 비밀번호 혹은 토큰과 같은 민감한 정보는 Git에 추가하지 말것
#### Note
# 시크릿의 환경 변수 값들은 base64에서 디코딩되어 컨테이너내 주입되기 때문에,
# 실제 비밀번호와 API 키를 base64로 인코딩한 값으로 대체해야 한다.

apiVersion: v1
kind: Secret
metadata:
  name: qdrant-secret

type: Opaque

data:
  QDRANT__SERVICE__API_KEY: YOUR_BASE64_ENCODED_API_KEY
  QDRANT__SERVICE__READ_ONLY_API_KEY: YOUR_BASE64_ENCODED_READ_ONLY_API_KEY