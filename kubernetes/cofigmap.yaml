apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  MYSQL_HOST: database-mysql-server
  MYSQL_PORT: "3306"
  MYSQL_DATABASE: ocrdb
  MYSQL_USER: user
  MYSQL_PASSWORD: ${MYSQL_PASSWORD}
---
apiVersion: v1
kind: Pod
metadata:
  name: web-app-pod
  labels:
    app: web-app
spec:
  containers:
  - name: vite-web-container
    image: <vite-web-image>
    ports:
    - containerPort: 50001
---
apiVersion: v1
kind: Pod
metadata:
  name: spring-server-pod
  labels:
    app: spring-server
spec:
  replicas: 1
  containers:
  - name: spring-server-container
    image: <spring-server-image>
    envFrom:
    - configMapRef:
        name: app-config
    - secretRef:
        name: app-secret
    ports:
    - containerPort: 60001
---
apiVersion: v1
kind: Pod
metadata:
  name: python-ai-pod
spec:
  replicas: 1
  containers:
  - name: python-ai-container
    image: <python-ai-image>
    ports:
    - containerPort: 60100

  - name: python-embedding-container
    image: <python-embedding-image>
    ports:
    - containerPort: 60110
---
apiVersion: v1
kind: Pod
metadata:
  name: mysql-pod
labels:
  app: mysql
data:
  MYSQL_HOST: database-mysql-server
  MYSQL_PORT: "3306"
  MYSQL_USER: user
  MYSQL_PASSWORD: ${MYSQL_PASSWORD}
  MYSQL_DATABASE: ocrdb
spec:
  replicas: 1
  containers:
  # MySQL Container and sub services plugin
  - name: mysql-container
    image: mysql:8-oraclelinux9
    envFrom:
    - configMapRef:
        name: app-config
    - secretRef:
        name: app-secret
    ports:
    - containerPort: 3306
  # Qdrant vector database container
  - name: qdrant-container
    image: qdrant/qdrant:v1.20
    envFrom:
    - configMapRef:
        name: app-config
    - secretRef:
        name: app-secret
    ports:
    - containerPort: 6333
---