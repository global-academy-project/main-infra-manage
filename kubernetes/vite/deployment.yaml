apiVersion: apps/v1
kind: Deployment
metadata:
  name: vite-app

spec:
  selector:
    matchLabels:
      app: vite-app
  template:
    metadata:
      labels:
        app: vite-app
    spec:
      containers:
      - name: vite-container
        image: orc-vite-app:latest
        # 
        resources:
          # Resource Limits and Requests
          # Resource values can be specified in either binary (Ki, Mi, Gi) or decimal (k, M, G) units [1024 = 1Ki but 1000 = 1k]
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        command: ["npm"]
        args: ["run", "preview", "--", "--host", "0.0.0.0", "--port", "30080"]
        ports:
          - name: http
            containerPort: 30080
            protocol: TCP

