global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]

  # Spring Boot 애플리케이션에 Prometheus 의존성과 /actuator/prometheus 엔드포인트가 적용된 경우 사용
  - job_name: "spring-boot"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["spring-boot-application:60001"]

  # Prometheus 메트릭을 제공하는 FastAPI 애플리케이션 엔드포인트가 있는 경우 사용
  - job_name: "python-ai-model"
    metrics_path: /metrics
    static_configs:
      - targets: ["python-ai-model:60100"]

  # Docker 컨테이너 메트릭 수집을 위해서는 별도 node-exporter 또는 cAdvisor 구성 필요