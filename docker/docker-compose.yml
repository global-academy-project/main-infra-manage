  #### Monitoring services
  ## 로컬 환경에서만 현재 사용하며, 다른 환경에서는 아래 두 서비스 전체를 주석 처리한다.
  prometheus:
    image: prom/prometheus:v3.13.5
    container_name: prometheus-container
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus:rw
    ports:
      - "9090:9090"
    networks:
      - default

  grafana:
    image: grafana/grafana:13.0-slim
    container_name: grafana-container
    volumes:
      - grafana-data:/var/lib/grafana:rw
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    networks:
      - default
  
#----------------------------------------------------------------------------------

#### Default network is bridge connection containers
# bridge  :	같은 Docker 호스트의 컨테이너끼리 통신하는 가상 네트워크	일반적인 Compose 개발·배포
# host    :	호스트 네트워크를 직접 사용	네트워크 격리를 없애야 하는 특수 상황
# overlay :	여러 Docker 호스트에 걸친 네트워크	Docker Swarm
# macvlan :	컨테이너에 별도 MAC 주소를 부여해 물리 LAN에 직접 연결	컨테이너를 독립 장비처럼 노출
# ipvlan  :	컨테이너에 별도 IP 주소를 부여해 물리 LAN에 직접 연결	컨테이너를 독립 장비처럼 노출

networks:
  default:
    driver: bridge
  
#### Default volume is local storage
volumes:
  database-data:
    driver: local
  qdrant-data:
    driver: local
  ai-model-cache:
    driver: local
  embedding-model-cache:
    driver: local
  grafana-data:
    driver: local
  prometheus-data:
    driver: local
  default:
    driver: local