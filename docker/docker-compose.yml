services:
  # Vite web application service (frontend)
  web-app:
    restart: always
    environment:
      - VITE_API_PROXY_TARGET=http://server-app:60001
    build:
      context: ../../main-vite-web
      dockerfile: Dockerfile
    networks:
      - web-network
    ports:
      - "${WEB_FRONTEND_PORT:-50001}:50001"

  # Spring server application service (handles backend API requests)
  server-app:
    restart: always
    build:
      context: ../../main-server
      dockerfile: Dockerfile
    networks:
      - server-network
      - web-network
    environment:
      # Use the Compose service DNS name, not a host-machine or legacy container name.
      MYSQL_HOST: database-server
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${SPRING_MYSQL_DATABASE}
      MYSQL_USER: ${SPRING_MYSQL_USER}
      MYSQL_PASSWORD: ${SPRING_MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      # Creates a verified first ADMIN only when the database has no ADMIN account.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@admin.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-!abc1234}
      APP_OCR_BASE_URL: ${APP_OCR_BASE_URL:-http://ai-model-server:60100}
      APP_OCR_CLIENT: ${APP_OCR_CLIENT:-mock}
    ports:
      - "${SPRING_SERVER_PORT:-60001}:60001"
    depends_on:
      database-server:
        condition: service_healthy
      ai-model-server:
        condition: service_healthy

  # AI model server service (handles AI-related tasks)
  ai-model-server:
    restart: always
    build:
      context: ../../main-ai-model
      dockerfile: Dockerfile
    networks:
      - server-network
    environment:
      # - APP_NAME=${APP_NAME}
      # - APP_VERSION=${APP_VERSION}
      # - APP_ENV=${APP_ENV}
      # - DEBUG=${DEBUG}
      # - AI_PROVIDER=${AI_PROVIDER}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL}
      # - PDF_BACKEND=${PDF_BACKEND}
      # - DEFAULT_PDF_BACKEND=${DEFAULT_PDF_BACKEND}
      - AI_TIMEOUT_SECONDS=30
      - AI_MAX_OUTPUT_TOKENS=${AI_MAX_OUTPUT_TOKENS}
      - NETWORK_ENV=${NETWORK_ENV}
      - DEFAULT_LLM_ENGINE=${DEFAULT_LLM_ENGINE}
    ports:
      - "${AI_MODEL_SERVER_PORT:-60100}:60100"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:60100/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Database server service (MySQL)
  database-server:
    restart: always
    image: mysql:8.4.11-oraclelinux9
    command: ["mysqld", "--log-bin-trust-function-creators=1"]
    networks:
      - server-network
    volumes:
      - ../db:/docker-entrypoint-initdb.d:ro
      - database-data:/var/lib/mysql
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    ports:
      - "${MYSQL_PORT:-60010}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s

# 데이터 저장을 위한 볼륨 디렉터리 정의
volumes:
  database-data:
    driver: local

# 웹 앱과 서버 간 통신용 네트워크
networks:
  web-network:
    driver: bridge
  # 서버, AI 서버, DB 간 통신용 네트워크
  server-network:
    driver: bridge
